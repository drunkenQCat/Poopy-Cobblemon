plugins {
    id 'java-library'
    // ModDevGradle：NeoForge 官方推荐的 1.21.1 开发插件（1.0.x 最后稳定版）
    id 'net.neoforged.moddev' version '1.0.24'
}

group = 'com.poopycobblemon'
version = file('VERSION').text.trim()
def extVersion = file('cobblemon-ext/VERSION').text.trim()

base {
    archivesName = 'poopy-cobblemon'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 让 mods.toml 里的 ${file.jarVersion} 解析出真实版本号
tasks.named('jar', Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
    from('LICENSE', 'LICENSE-ASSETS.md')
    from('LICENSES') { into 'LICENSES' }
    manifest {
        attributes 'Implementation-Version': project.version
    }
}

// 让编译产物带上 UTF-8（源码里有中文注释/字符串）
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

neoForge {
    // 与 Prism 实例里安装的 NeoForge 保持一致
    version = "21.1.240"

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }

    mods {
        poopy_cobblemon {
            sourceSet(sourceSets.main)
        }
    }
}

// Resolve external mods through Maven; keep them out of the release JAR.
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

configurations {
    poopskyArtifact { canBeConsumed = false; transitive = false }
    compileOnly.extendsFrom poopskyArtifact
}

// PoopSky already ships Registrate. Compile against that exact bundled copy.
def extractRegistrate = tasks.register('extractRegistrate', Sync) {
    from({ zipTree(configurations.poopskyArtifact.singleFile) }) {
        include 'META-INF/jarjar/Registrate-*.jar'
        eachFile { path = 'registrate.jar' }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('dependencies')
    doFirst {
        def entries = zipTree(configurations.poopskyArtifact.singleFile).matching {
            include 'META-INF/jarjar/Registrate-*.jar'
        }
        if (entries.files.size() != 1) {
            throw new GradleException('Expected exactly one bundled Registrate JAR in PoopSky')
        }
    }
}

dependencies {
    compileOnly("maven.modrinth:cobblemon:${cobblemon_version}") { transitive = false }
    poopskyArtifact "maven.modrinth:poopsky:${poopsky_version}"
    compileOnly files(layout.buildDirectory.file('dependencies/registrate.jar')).builtBy(extractRegistrate)
    compileOnly "com.poopycobblemon:cobblemon-ext:${extVersion}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
}

// 在真实生产方法上验证回合等待；不需要启动 Minecraft 或下载测试框架。
tasks.register('turnRegression', Exec) {
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir projectDir
    commandLine 'node', 'showdowntest/turn_regression_test.js',
            launcher.get().metadata.installationPath.asFile.absolutePath
}
tasks.named('check') { dependsOn 'turnRegression', gradle.includedBuild('cobblemon-ext').task(':build') }

// ---------------------------------------------------------------
// 一键把编译好的 mod jar 复制进 Prism 实例的 mods 目录
// 用法：gradlew installToInstance
// ---------------------------------------------------------------
def instanceModsDir = rootProject.layout.projectDirectory.dir('../minecraft/mods').asFile
def extensionJar = file("cobblemon-ext/build/libs/cobblemon-ext-${extVersion}.jar")
tasks.register('installToInstance', Copy) {
    dependsOn tasks.named('jar'), gradle.includedBuild('cobblemon-ext').task(':jar')
    from(tasks.named('jar'))
    from(extensionJar)
    into(instanceModsDir)
    doFirst {
        if (!extensionJar.isFile()) {
            throw new GradleException('Build both mods first with python scripts/build.py')
        }
        if (!instanceModsDir.exists()) {
            throw new GradleException("找不到实例 mods 目录: ${instanceModsDir}")
        }
        // Replace earlier builds of the two current mods before installation.
        delete fileTree(instanceModsDir) {
            include 'poopy-cobblemon-*.jar', 'poopy-cobblemon-*.jar.duplicate',
                    'cobblemon-ext-*.jar', 'cobblemon-ext-*.jar.duplicate'
        }
        println ">>> 正把 mod jar 安装到: ${instanceModsDir}"
    }
}

// Run packaging failure-path checks from both Gradle and the release entry point.
tasks.register('releaseRegression', Exec) {
    workingDir projectDir
    commandLine 'python', '-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_*.py'
}
tasks.named('check') { dependsOn 'releaseRegression' }
