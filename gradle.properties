# Gradle 守护进程参数
# 注意：本机命令行工具的 HTTPS 必须走 127.0.0.1:7890（Clash 代理），
# 否则 Maven Central / NeoForge 仓库全部连不上。代理不在了把下面 -Dhttp(s).proxy* 删掉即可。
org.gradle.jvmargs=-Xmx3G -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7890 -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=7890

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true