pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'poopy-cobblemon'

if (!file('cobblemon-ext/settings.gradle').isFile()) {
    throw new GradleException('Initialize the extension with: git submodule update --init --recursive')
}
includeBuild('cobblemon-ext')
